name: Build IPA
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Giai nen du an
        run: |
          if [ -f JinnFiles.zip ]; then unzip -q -o JinnFiles.zip; fi
          cd JinnFiles 2>/dev/null || true
          echo "WORKDIR=$(pwd)" >> $GITHUB_ENV
      - run: brew install xcodegen
      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: |
          xcodegen generate
          xcodebuild -project JinnFiles.xcodeproj -scheme JinnFiles -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/JinnFiles.app Payload/
          zip -qr JinnFiles.ipa Payload
          ls -la JinnFiles.ipa
      - name: Dang IPA len Releases
        working-directory: ${{ env.WORKDIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "build-${{ github.run_number }}" JinnFiles.ipa \
            --title "Jinn Files build ${{ github.run_number }}" \
            --notes "IPA chua ky, cai bang cong cu sideload"
      - uses: actions/upload-artifact@v4
        with:
          name: JinnFiles-ipa
          path: ${{ env.WORKDIR }}/JinnFiles.ipa
