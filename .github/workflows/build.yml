name: Build IPA

on:
  workflow_dispatch:
    inputs:
      bump:
        description: "Loại cập nhật phiên bản"
        required: true
        default: "nho (3.3 -> 3.3.1 -> 3.3.2)"
        type: choice
        options:
          - "nho (3.3 -> 3.3.1 -> 3.3.2)"
          - "lon (3.3.x -> 3.4 -> 3.5)"
          - "giu-nguyen"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Giai nen du an
        run: |
          if [ -f JinnFiles.zip ]; then unzip -q -o JinnFiles.zip; fi
          cd JinnFiles 2>/dev/null || true
          echo "WORKDIR=$(pwd)" >> $GITHUB_ENV

      - name: Tu dong cap nhat phien ban
        working-directory: ${{ env.WORKDIR }}
        env:
          BUMP_TYPE: ${{ inputs.bump }}
        run: |
          python3 - << 'EOF'
          import os, re

          bump = os.environ.get("BUMP_TYPE", "giu-nguyen")
          with open("project.yml", "r", encoding="utf-8") as f:
              text = f.read()

          ver_match = re.search(r'MARKETING_VERSION:\s*"([^"]+)"', text)
          bld_match = re.search(r'CURRENT_PROJECT_VERSION:\s*"([^"]+)"', text)
          cur_ver = ver_match.group(1) if ver_match else "3.3"
          cur_bld = int(bld_match.group(1)) if bld_match else 1

          parts = [int(x) for x in cur_ver.split(".")]
          while len(parts) < 2:
              parts.append(0)

          if bump.startswith("nho"):
              if len(parts) == 2:
                  new_ver = f"{parts[0]}.{parts[1]}.1"
              else:
                  new_ver = f"{parts[0]}.{parts[1]}.{parts[2] + 1}"
              new_bld = cur_bld + 1
          elif bump.startswith("lon"):
              new_ver = f"{parts[0]}.{parts[1] + 1}"
              new_bld = cur_bld + 1
          else:
              new_ver = cur_ver
              new_bld = cur_bld

          if new_ver != cur_ver or new_bld != cur_bld:
              text = re.sub(r'(MARKETING_VERSION:\s*)"[^"]+"', rf'\1"{new_ver}"', text, count=1)
              text = re.sub(r'(CURRENT_PROJECT_VERSION:\s*)"[^"]+"', rf'\1"{new_bld}"', text, count=1)
              with open("project.yml", "w", encoding="utf-8") as f:
                  f.write(text)

          print(f"Version: {cur_ver} -> {new_ver} (build {new_bld})")
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as envf:
              envf.write(f"NEW_VERSION={new_ver}\n")
              envf.write(f"NEW_BUILD={new_bld}\n")
          EOF

          if [[ "$BUMP_TYPE" != "giu-nguyen" ]] && git ls-files --error-unmatch project.yml >/dev/null 2>&1; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add project.yml
            git diff --cached --quiet || (git commit -m "Bump version to ${NEW_VERSION} (build ${NEW_BUILD})" && git push)
          fi

      - name: Cai xcodegen
        run: brew install xcodegen

      - name: Build
        working-directory: ${{ env.WORKDIR }}
        run: |
          set -o pipefail
          xcodegen generate 2>&1 | tee build.log
          xcodebuild -project JinnFiles.xcodeproj -scheme JinnFiles \
            -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build 2>&1 | tee -a build.log

      - name: Dong goi IPA (ten tep gom so phien ban)
        working-directory: ${{ env.WORKDIR }}
        run: |
          VERSION=$(grep -m1 'MARKETING_VERSION' project.yml | sed -E 's/.*"([^"]+)".*/\1/')
          IPA="JinnFiles${VERSION}.ipa"
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "IPA=$IPA" >> $GITHUB_ENV
          rm -rf Payload JinnFiles*.ipa
          mkdir Payload
          cp -R build/Build/Products/Release-iphoneos/JinnFiles.app Payload/
          find Payload -name ".DS_Store" -delete
          ditto -c -k --keepParent Payload "$IPA"
          ls -la "$IPA"

      - name: Kiem tra IPA
        working-directory: ${{ env.WORKDIR }}
        run: |
          unzip -tq "$IPA"
          {
            echo "### Thong tin IPA: $IPA (chup man hinh phan nay neu ky bi loi)"
            echo
            ls -la "$IPA"
            shasum -a 256 "$IPA"
            unzip -l "$IPA" | head -12
            plutil -p Payload/JinnFiles.app/Info.plist | head -45
            echo
          } >> $GITHUB_STEP_SUMMARY

      - name: Hien thi loi bien dich
        if: failure()
        working-directory: ${{ env.WORKDIR }}
        run: |
          {
            echo '### Loi bien dich'
            echo
            if [ -f build.log ]; then
              grep -E "error:|fatal error:|FAILED" build.log | sort -u | head -40
            else
              echo "Khong co build.log"
            fi
            echo
          } >> $GITHUB_STEP_SUMMARY

      - name: Dang IPA len Releases
        working-directory: ${{ env.WORKDIR }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "v${VERSION}-build${{ github.run_number }}" "$IPA" \
            --title "Jinn Files ${VERSION} (build ${{ github.run_number }})" \
            --notes "IPA chua ky, cai bang cong cu sideload"

      - uses: actions/upload-artifact@v4
        with:
          name: JinnFiles${{ env.VERSION }}-ipa
          path: ${{ env.WORKDIR }}/${{ env.IPA }}
